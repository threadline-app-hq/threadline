name: Keep Threadline warm
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check the app and database
        run: |
          curl --fail --show-error --silent --max-time 90 --retry 2 --retry-delay 5 https://threadline-app-jpc0.onrender.com/api/health
